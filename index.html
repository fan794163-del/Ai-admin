<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZARO HACK - FIREBASE ADMIN PANEL</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0e14; color: #fff; }
  .admin-container { max-width: 600px; margin: 0 auto; padding: 15px; height: 100%; display: flex; flex-direction: column; }
  
  .admin-header { background: #121620; padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 15px; }
  .admin-title { font-size: 16px; font-weight: 900; color: #f5b81b; letter-spacing: 1px; }
  .add-btn { width: 35px; height: 35px; background: #00f5a0; color: #0b0e14; border: none; border-radius: 50%; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 10px rgba(0,245,160,0.4); }

  .user-list-box { flex: 1; overflow-y: auto; background: #121620; border-radius: 14px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); }
  .user-card { background: #181d28; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
  .user-info div { font-size: 11px; margin-bottom: 3px; }
  .user-name { font-size: 14px; font-weight: 900; color: #00f5a0; }
  
  .action-btns button { padding: 5px 10px; border-radius: 6px; border: none; font-size: 10px; font-weight: bold; cursor: pointer; margin-left: 5px; }
  .btn-block { background: #ffaa00; color: #0b0e14; }
  .btn-unblock { background: #00f5a0; color: #0b0e14; }
  .btn-delete { background: #ff1e4d; color: #fff; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
  .modal-box { background: #121620; border: 1.5px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 16px; width: 100%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
  .modal-title { font-size: 14px; font-weight: 900; color: #f5b81b; margin-bottom: 12px; text-align: center; }
  .form-input { width: 100%; background: #181d28; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 12px; outline: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
  .modal-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
  .btn-save { background: #00f5a0; color: #0b0e14; }
  .btn-cancel { background: #232a38; color: #fff; }
</style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div>
        <div class="admin-title">ZARO ADMIN PANEL</div>
        <div style="font-size: 9px; color: #8a99ad;">Firebase Realtime Connected</div>
      </div>
      <button class="add-btn" onclick="openModal()">+</button>
    </div>

    <div class="user-list-box" id="adminUserList">
      <div style="text-align:center; color:#8a99ad; margin-top:20px; font-size:11px;">Loading users from Firebase...</div>
    </div>
  </div>

  <!-- Modal Popup -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-box">
      <div class="modal-title">ADD NEW USER</div>
      <input type="text" id="newUsername" class="form-input" placeholder="Username">
      <input type="text" id="newPassword" class="form-input" placeholder="Password">
      <div style="font-size: 10px; color: #8a99ad; margin-bottom: 4px;">Expiry Date (মেয়াদ):</div>
      <input type="date" id="newExpiry" class="form-input">
      
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-btn btn-save" onclick="saveNewUser()">Save</button>
      </div>
    </div>
  </div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDli6acsnr-Dd_g5IQ5x1pCkw4Ih-BzkZ8",
    authDomain: "new-tool-82dd2.firebaseapp.com",
    databaseURL: "https://new-tool-82dd2-default-rtdb.firebaseio.com",
    projectId: "new-tool-82dd2",
    storageBucket: "new-tool-82dd2.firebasestorage.app",
    messagingSenderId: "921784254535",
    appId: "1:921784254535:web:1741dd1e86966746283162",
    measurementId: "G-84PPMWTYJ9"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let usersDB = {};

  // Fetch users in real-time from Firebase
  database.ref('users').on('value', (snapshot) => {
    usersDB = snapshot.val() || {};
    renderAdminList();
  });

  function renderAdminList() {
    let container = document.getElementById('adminUserList');
    container.innerHTML = "";

    let keys = Object.keys(usersDB);
    if (keys.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:#8a99ad; margin-top:20px; font-size:11px;">No Users Found. Click '+' to add.</div>`;
      return;
    }

    keys.forEach(username => {
      let uData = usersDB[username];
      let isBlocked = (uData.status === "Blocked");

      container.innerHTML += `
        <div class="user-card">
          <div class="user-info">
            <div class="user-name">${username.toUpperCase()}</div>
            <div>UID: ${uData.uid}</div>
            <div>Pass: ${uData.pass}</div>
            <div>Expiry: <span style="color:${isBlocked?'#ff1e4d':'#00f5a0'}">${uData.expiry}</span></div>
            <div>Status: <span style="color:${isBlocked?'#ff1e4d':'#00f5a0'}">${uData.status}</span></div>
          </div>
          <div class="action-btns">
            <button class="${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${username}')">
              ${isBlocked ? 'Unblock' : 'Block'}
            </button>
            <button class="btn-delete" onclick="deleteUser('${username}')">Delete</button>
          </div>
        </div>
      `;
    });
  }

  function openModal() {
    document.getElementById('userModal').style.display = 'flex';
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('newExpiry').value = '';
  }

  function closeModal() {
    document.getElementById('userModal').style.display = 'none';
  }

  function saveNewUser() {
    let u = document.getElementById('newUsername').value.trim();
    let p = document.getElementById('newPassword').value.trim();
    let exp = document.getElementById('newExpiry').value;

    if (!u || !p || !exp) {
      alert("All fields are required!");
      return;
    }

    if (usersDB[u]) {
      alert("Username already exists!");
      return;
    }

    let randomUid = "ZARO-UID-" + Math.floor(1000 + Math.random() * 9000);
    let today = new Date().toISOString().split('T')[0];

    database.ref('users/' + u).set({
      pass: p,
      uid: randomUid,
      expiry: exp,
      status: "Active",
      loginDate: today
    }, (error) => {
      if (error) {
        alert("Failed to save to Firebase!");
      } else {
        closeModal();
      }
    });
  }

  function toggleBlock(username) {
    let currentStatus = usersDB[username].status;
    let newStatus = (currentStatus === "Blocked") ? "Active" : "Blocked";
    database.ref('users/' + username).update({ status: newStatus });
  }

  function deleteUser(username) {
    if (confirm(`Are you sure you want to delete ${username}?`)) {
      database.ref('users/' + username).remove();
    }
  }
</script>
</body>
</html>
